name: Build extension and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravityforce-build
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Pack Chrome extension
        run: python3 scripts/pack-extension.py

      - id: meta
        name: Read version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packed Gravity Force $VERSION"

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p _site
          cp -a site/. _site/
          cp dist/gravity-force-extension.zip _site/gravity-force-extension.zip
          cp dist/version.json _site/version.json
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import json
          version = json.loads(Path("dist/version.json").read_text())["version"]
          index = Path("_site/index.html")
          index.write_text(index.read_text().replace("{{VERSION}}", version))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gravity-force-extension
          path: |
            dist/gravity-force-extension.zip
            dist/version.json
          if-no-files-found: error

      - name: Publish GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
          commit_message: Deploy Gravity Force site and extension zip

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v${VERSION}"
          NOTES=$(cat <<EOF
          Gravity Force ${VERSION} — Bandwidth Investigation Mode for GeForce NOW.

          Independent overlay. Not affiliated with NVIDIA.

          - Website: https://matthewcodergamer.github.io/gravityforce/
          - Extension zip: https://github.com/matthewcodergamer/gravityforce/releases/download/${TAG}/gravity-force-extension.zip
          - Sideload: unzip, then Chrome → Extensions → Developer mode → Load unpacked
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/gravity-force-extension.zip --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/gravity-force-extension.zip \
              --title "Gravity Force ${VERSION}" \
              --notes "$NOTES"
          fi
