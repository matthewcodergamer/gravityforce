name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and pack extension
        run: python3 scripts/pack-extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: gravity-force-extension-ci
          path: dist/gravity-force-extension.zip
