<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gravity Force</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <p class="brand">GRAVITY FORCE</p>
        <p class="sub">Bandwidth Investigation</p>
      </div>
    </header>
    <p class="disclaimer">Independent. Not affiliated with NVIDIA.</p>
    <form id="form">
      <label>Available (Mbps)<input id="available" type="number" min="0" step="0.1" placeholder="92.0" required /></label>
      <label>Used (Mbps)<input id="used" type="number" min="0" step="0.1" placeholder="11.4" required /></label>
      <div class="row">
        <label>Resolution<select id="resolution"><option value="720p">720p</option><option value="1080p" selected>1080p</option><option value="1440p">1440p</option><option value="4k">4K</option></select></label>
        <label>FPS<select id="frameRate"><option value="30">30</option><option value="60" selected>60</option><option value="120">120</option><option value="240">240</option></select></label>
      </div>
      <label>Picture<select id="symptom"><option value="fine">Looks fine</option><option value="blurry">Blurry</option><option value="stuttering">Stuttering</option><option value="lagging">Lagging</option></select></label>
      <button type="submit">Investigate</button>
    </form>
    <section id="result" class="result hidden"></section>
    <nav class="actions">
      <a id="dashboard" href="https://github.com/matthewcodergamer/gravityforce" target="_blank" rel="noreferrer">Open dashboard</a>
      <a href="https://github.com/matthewcodergamer/gravityforce" target="_blank" rel="noreferrer">GitHub</a>
    </nav>
    <script src="popup.js"></script>
  </body>
</html>
